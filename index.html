<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scadenziario Studio Grismondi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .user-section {
            background: #34495e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: #3498db;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }

        .admin-badge {
            background: #e74c3c;
        }

        select, button, input {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        button {
            background: #3498db;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #ecf0f1;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .stat-totali .stat-number { color: #3498db; }
        .stat-dafare .stat-number { color: #f39c12; }
        .stat-completati .stat-number { color: #27ae60; }
        .stat-scaduti .stat-number { color: #e74c3c; }
        .stat-prossimi .stat-number { color: #9b59b6; }

        .controls {
            padding: 30px;
            background: white;
            border-top: 3px solid #ecf0f1;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            font-size: 14px;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-primary { background: #3498db; }
        .btn-success { background: #27ae60; }
        .btn-danger { background: #e74c3c; }
        .btn-warning { background: #f39c12; }
        .btn-secondary { background: #95a5a6; }
        .btn-purple { background: #9b59b6; }

        .adempimenti-list {
            padding: 30px;
        }

        .adempimento-card {
            background: white;
            border-left: 5px solid #3498db;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .adempimento-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transform: translateX(5px);
        }

        .adempimento-card.categoria-contabilita { border-left-color: #3498db; }
        .adempimento-card.categoria-tributi { border-left-color: #e74c3c; }
        .adempimento-card.categoria-personale { border-left-color: #9b59b6; }
        .adempimento-card.categoria-rendicontazione { border-left-color: #27ae60; }
        .adempimento-card.categoria-monitoraggi { border-left-color: #f39c12; }

        .adempimento-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .adempimento-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
            flex: 1;
        }

        .adempimento-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .badge-categoria-contabilita { background: #3498db; }
        .badge-categoria-tributi { background: #e74c3c; }
        .badge-categoria-personale { background: #9b59b6; }
        .badge-categoria-rendicontazione { background: #27ae60; }
        .badge-categoria-monitoraggi { background: #f39c12; }

        .badge-scaduto { background: #e74c3c; }
        .badge-prossimo { background: #f39c12; }
        .badge-normale { background: #95a5a6; }

        .adempimento-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 5px;
        }

        .adempimento-meta-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .adempimento-meta-item strong {
            color: #2c3e50;
            font-size: 12px;
        }

        .adempimento-meta-item span {
            color: #555;
            font-size: 14px;
        }

        .comuni-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 5px;
            overflow: hidden;
        }

        .comuni-table th {
            background: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            font-size: 13px;
        }

        .comuni-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 13px;
        }

        .comuni-table tr:hover {
            background: #f8f9fa;
        }

        .checkbox-cell {
            text-align: center;
            width: 80px;
        }

        .checkbox-cell input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .note-input {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 12px;
        }

        .note-input:focus {
            outline: none;
            border-color: #3498db;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.3s;
        }

        .adempimento-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }

        .adempimento-actions button {
            padding: 8px 16px;
            font-size: 13px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }

        .modal-header h2 {
            color: #2c3e50;
            font-size: 1.8em;
        }

        .close-modal {
            background: #e74c3c;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            background: #c0392b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3498db;
        }

        .comuni-selector {
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            padding: 15px;
            background: #f8f9fa;
        }

        .comune-checkbox {
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .comune-checkbox:hover {
            background: #ecf0f1;
        }

        .comune-checkbox input {
            width: auto;
            margin-right: 10px;
        }

        .comune-checkbox label {
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        .select-all-comuni {
            margin-bottom: 15px;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .select-all-comuni:hover {
            background: #2980b9;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #ecf0f1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .adempimento-meta {
                grid-template-columns: 1fr;
            }

            .comuni-table {
                font-size: 12px;
            }

            .comuni-table th,
            .comuni-table td {
                padding: 8px;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .loading-spinner {
            border: 4px solid #ecf0f1;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }

        .alert-scaduto {
            background: #e74c3c;
            color: white;
        }

        .alert-prossimo {
            background: #f39c12;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📅 Scadenziario Studio Grismondi</h1>
            <p>Sistema Professionale di Gestione Adempimenti Enti Locali</p>
        </div>

        <!-- User Section -->
        <div class="user-section">
            <div class="user-info">
                <span>Utente corrente:</span>
                <span class="user-badge" id="currentUserBadge">Andrea Grismondi</span>
            </div>
            <div>
                <select id="userSelector" onchange="switchUtente()">
                    <option value="Andrea Grismondi">Andrea Grismondi (Admin)</option>
                    <option value="Roberta">Roberta</option>
                    <option value="Nicoletta">Nicoletta</option>
                    <option value="Miriana">Miriana</option>
                </select>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
            <div class="stat-card stat-totali">
                <div class="stat-label">Adempimenti Totali</div>
                <div class="stat-number" id="statTotali">0</div>
            </div>
            <div class="stat-card stat-dafare">
                <div class="stat-label">Da Fare</div>
                <div class="stat-number" id="statDaFare">0</div>
            </div>
            <div class="stat-card stat-completati">
                <div class="stat-label">Completati</div>
                <div class="stat-number" id="statCompletati">0</div>
            </div>
            <div class="stat-card stat-scaduti">
                <div class="stat-label">Scaduti</div>
                <div class="stat-number" id="statScaduti">0</div>
            </div>
            <div class="stat-card stat-prossimi">
                <div class="stat-label">Prossimi 7gg</div>
                <div class="stat-number" id="statProssimi">0</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="filters">
                <div class="filter-group">
                    <label>Mese/Anno</label>
                    <input type="month" id="filtroMese" onchange="applicaFiltri()">
                </div>
                <div class="filter-group">
                    <label>Categoria</label>
                    <select id="filtroCategoria" onchange="applicaFiltri()">
                        <option value="">Tutte le categorie</option>
                        <option value="Contabilità">Contabilità Pubblica</option>
                        <option value="Tributi">Tributi</option>
                        <option value="Personale">Personale</option>
                        <option value="Rendicontazione">Rendicontazione</option>
                        <option value="Monitoraggi">Monitoraggi</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Stato</label>
                    <select id="filtroStato" onchange="applicaFiltri()">
                        <option value="">Tutti gli stati</option>
                        <option value="da_fare">Da Fare</option>
                        <option value="completato">Completato</option>
                        <option value="scaduto">Scaduti</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Comune</label>
                    <select id="filtroComune" onchange="applicaFiltri()">
                        <option value="">Tutti i comuni</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Responsabile</label>
                    <select id="filtroResponsabile" onchange="applicaFiltri()">
                        <option value="">Tutti i responsabili</option>
                        <option value="Andrea Grismondi">Andrea Grismondi</option>
                        <option value="Roberta">Roberta</option>
                        <option value="Nicoletta">Nicoletta</option>
                        <option value="Miriana">Miriana</option>
                    </select>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn-primary" id="btnNuovo" onclick="apriModalCreazione()">➕ Nuovo Adempimento</button>
                <button class="btn-secondary" onclick="pulisciFiltri()">🔄 Pulisci Filtri</button>
                <button class="btn-success" onclick="esportaDati()">📥 Esporta Excel</button>
                <button class="btn-warning" onclick="ripristinaDati()">📤 Importa Backup</button>
                <button class="btn-purple" onclick="mostraAlert()">🔔 Alert Scadenze</button>
            </div>
        </div>

        <!-- Lista Adempimenti -->
        <div class="adempimenti-list" id="adempimentiContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Caricamento adempimenti...</p>
            </div>
        </div>
    </div>

    <!-- Modal Creazione/Modifica -->
    <div class="modal" id="modalAdempimento">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitolo">Nuovo Adempimento</h2>
                <button class="close-modal" onclick="chiudiModal()">✕</button>
            </div>
            <form id="formAdempimento" onsubmit="salvaAdempimento(event)">
                <input type="hidden" id="adempimentoId">
                
                <div class="form-group">
                    <label for="inputTitolo">Titolo Adempimento *</label>
                    <input type="text" id="inputTitolo" required placeholder="Es: Invio documentazione stipendi">
                </div>

                <div class="form-group">
                    <label for="inputDescrizione">Descrizione Dettagliata</label>
                    <textarea id="inputDescrizione" placeholder="Dettagli aggiuntivi sull'adempimento..."></textarea>
                </div>

                <div class="form-group">
                    <label for="inputCategoria">Categoria *</label>
                    <select id="inputCategoria" required>
                        <option value="Contabilità">Contabilità Pubblica</option>
                        <option value="Tributi">Tributi</option>
                        <option value="Personale">Personale</option>
                        <option value="Rendicontazione">Rendicontazione</option>
                        <option value="Monitoraggi">Monitoraggi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputScadenza">Data Scadenza *</label>
                    <input type="date" id="inputScadenza" required>
                </div>

                <div class="form-group">
                    <label for="inputResponsabile">Responsabile</label>
                    <select id="inputResponsabile">
                        <option value="">Non assegnato</option>
                        <option value="Andrea Grismondi">Andrea Grismondi</option>
                        <option value="Roberta">Roberta</option>
                        <option value="Nicoletta">Nicoletta</option>
                        <option value="Miriana">Miriana</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Comuni Interessati *</label>
                    <button type="button" class="select-all-comuni" onclick="toggleTuttiComuni()">Seleziona/Deseleziona Tutti</button>
                    <div class="comuni-selector" id="comuniSelector"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-success">💾 Salva Adempimento</button>
                    <button type="button" class="btn-secondary" onclick="chiudiModal()">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAZIONE GLOBALE
        // ============================================
        
        const COMUNI = [
            'Bossico', 'Carobbio degli Angeli', 'Castro', 'Cavernago',
            'Cenate Sotto', 'Colere', 'Filago', 'Foppolo', 'Onore',
            'Osio Sopra', 'Osio Sotto', 'Parzanica', 'Ponte San Pietro',
            'Rogno', 'Selvino', 'Solto Collina', 'Telgate',
            'Ubiale Clanezzo', 'Zanica'
        ];

        const UTENTI = {
            'Andrea Grismondi': { ruolo: 'admin' },
            'Roberta': { ruolo: 'user' },
            'Nicoletta': { ruolo: 'user' },
            'Miriana': { ruolo: 'user' }
        };

        const STORAGE_KEY = 'scadenziari_adempimenti';
        
        let adempimenti = [];
        let utenteCorrente = 'Andrea Grismondi';
        let adempimentoInModifica = null;

        // ============================================
        // INIZIALIZZAZIONE
        // ============================================

        function inizializzaSistema() {
            console.log('🚀 Inizializzazione Sistema Scadenziario Studio Grismondi...');
            
            caricaDati();
            popolaFiltroComuni();
            popolaComuniModal();
            impostaFiltroMeseCorrente();
            aggiornaStatistiche();
            renderizzaAdempimenti();
            aggiornaPermessi();
            
            console.log('✅ Sistema inizializzato con successo');
            console.log('📊 Adempimenti caricati:', adempimenti.length);
        }

        // ============================================
        // GESTIONE PERSISTENZA DATI
        // ============================================

        function caricaDati() {
            try {
                const datiSalvati = localStorage.getItem(STORAGE_KEY);
                if (datiSalvati) {
                    adempimenti = JSON.parse(datiSalvati);
                    console.log('✅ Dati caricati da localStorage:', adempimenti.length, 'adempimenti');
                } else {
                    adempimenti = [];
                    console.log('ℹ️ Nessun dato salvato, array vuoto inizializzato');
                }
            } catch (error) {
                console.error('❌ Errore nel caricamento dati:', error);
                adempimenti = [];
            }
        }

        function salvaDati() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(adempimenti));
                console.log('💾 Dati salvati in localStorage:', adempimenti.length, 'adempimenti');
                return true;
            } catch (error) {
                console.error('❌ Errore nel salvataggio dati:', error);
                alert('Errore nel salvataggio dei dati. Controlla lo spazio disponibile.');
                return false;
            }
        }

        function esportaDati() {
            try {
                let csvContent = "Titolo,Categoria,Scadenza,Responsabile,Comune,Da Fare,Fatto,Note\n";
                
                adempimenti.forEach(adempimento => {
                    adempimento.Comuni.split(';').forEach(comune => {
                        const statoComune = adempimento.StatiComuni[comune.trim()] || { daFare: false, fatto: false, note: '' };
                        csvContent += `"${adempimento.Titolo}","${adempimento.Categoria}","${adempimento.Scadenza}","${adempimento.Responsabile || ''}","${comune.trim()}","${statoComune.daFare ? 'SI' : 'NO'}","${statoComune.fatto ? 'SI' : 'NO'}","${statoComune.note || ''}"\n`;
                    });
                });
                
                const dataBlob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'scadenziario_' + new Date().toISOString().split('T')[0] + '.csv';
                link.click();
                URL.revokeObjectURL(url);
                console.log('📥 Dati esportati in CSV');
                alert('✅ Dati esportati con successo!');
            } catch (error) {
                console.error('❌ Errore esportazione:', error);
                alert('Errore durante l\'esportazione dei dati');
            }
        }

        function ripristinaDati() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const datiImportati = JSON.parse(e.target.result);
                            if (Array.isArray(datiImportati)) {
                                if (confirm('Confermi il ripristino? Tutti i dati attuali saranno sovrascritti.')) {
                                    adempimenti = datiImportati;
                                    salvaDati();
                                    aggiornaStatistiche();
                                    renderizzaAdempimenti();
                                    alert('✅ Dati ripristinati con successo!');
                                    console.log('📤 Backup ripristinato:', adempimenti.length, 'adempimenti');
                                }
                            } else {
                                throw new Error('Formato file non valido');
                            }
                        } catch (error) {
                            console.error('❌ Errore ripristino:', error);
                            alert('Errore: file non valido o corrotto');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        // ============================================
        // GESTIONE UTENTI
        // ============================================

        function switchUtente() {
            const selector = document.getElementById('userSelector');
            utenteCorrente = selector.value;
            
            const badge = document.getElementById('currentUserBadge');
            badge.textContent = utenteCorrente;
            
            if (UTENTI[utenteCorrente].ruolo === 'admin') {
                badge.classList.add('admin-badge');
            } else {
                badge.classList.remove('admin-badge');
            }
            
            aggiornaPermessi();
            console.log('👤 Utente cambiato:', utenteCorrente, '- Ruolo:', UTENTI[utenteCorrente].ruolo);
        }

        function aggiornaPermessi() {
            const isAdmin = UTENTI[utenteCorrente].ruolo === 'admin';
            const btnNuovo = document.getElementById('btnNuovo');
            
            if (btnNuovo) {
                btnNuovo.disabled = !isAdmin;
            }
            
            renderizzaAdempimenti();
        }

        function isUtenteAdmin() {
            return UTENTI[utenteCorrente].ruolo === 'admin';
        }

        // ============================================
        // POPOLAMENTO FILTRI E SELETTORI
        // ============================================

        function popolaFiltroComuni() {
            const filtroComune = document.getElementById('filtroComune');
            filtroComune.innerHTML = '<option value="">Tutti i comuni</option>';
            
            COMUNI.forEach(comune => {
                const option = document.createElement('option');
                option.value = comune;
                option.textContent = comune;
                filtroComune.appendChild(option);
            });
        }

        function popolaComuniModal() {
            const container = document.getElementById('comuniSelector');
            container.innerHTML = '';
            
            COMUNI.forEach(comune => {
                const div = document.createElement('div');
                div.className = 'comune-checkbox';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'comune_' + comune.replace(/\s/g, '_');
                checkbox.value = comune;
                checkbox.name = 'comuni';
                
                const label = document.createElement('label');
                label.htmlFor = checkbox.id;
                label.textContent = comune;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                container.appendChild(div);
            });
        }

        function impostaFiltroMeseCorrente() {
            const oggi = new Date();
            const anno = oggi.getFullYear();
            const mese = String(oggi.getMonth() + 1).padStart(2, '0');
            document.getElementById('filtroMese').value = `${anno}-${mese}`;
        }

        // ============================================
        // GESTIONE STATISTICHE
        // ============================================

        function aggiornaStatistiche() {
            const oggi = new Date();
            oggi.setHours(0, 0, 0, 0);
            
            const settimana = new Date(oggi);
            settimana.setDate(settimana.getDate() + 7);
            
            let totali = 0;
            let daFare = 0;
            let completati = 0;
            let scaduti = 0;
            let prossimi = 0;
            
            adempimenti.forEach(adempimento => {
                const scadenza = new Date(adempimento.Scadenza);
                scadenza.setHours(0, 0, 0, 0);
                
                const comuni = adempimento.Comuni.split(';');
                const statiComuni = adempimento.StatiComuni || {};
                
                comuni.forEach(comune => {
                    const comunePulito = comune.trim();
                    const stato = statiComuni[comunePulito] || { daFare: false, fatto: false };
                    
                    totali++;
                    
                    if (stato.fatto) {
                        completati++;
                    } else {
                        daFare++;
                        if (scadenza < oggi) {
                            scaduti++;
                        } else if (scadenza <= settimana) {
                            prossimi++;
                        }
                    }
                });
            });
            
            document.getElementById('statTotali').textContent = totali;
            document.getElementById('statDaFare').textContent = daFare;
            document.getElementById('statCompletati').textContent = completati;
            document.getElementById('statScaduti').textContent = scaduti;
            document.getElementById('statProssimi').textContent = prossimi;
        }

        // ============================================
        // RENDERIZZAZIONE ADEMPIMENTI
        // ============================================

        function renderizzaAdempimenti() {
            const container = document.getElementById('adempimentiContainer');
            const adempimentiFiltrati = applicaFiltri();
            
            if (adempimentiFiltrati.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h3>Nessun adempimento trovato</h3>
                        <p>Non ci sono adempimenti che corrispondono ai filtri selezionati.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            adempimentiFiltrati.forEach(adempimento => {
                const card = creaCardAdempimento(adempimento);
                container.appendChild(card);
            });
        }

        function creaCardAdempimento(adempimento) {
            const card = document.createElement('div');
            card.className = 'adempimento-card categoria-' + adempimento.Categoria.toLowerCase();
            
            const oggi = new Date();
            oggi.setHours(0, 0, 0, 0);
            const scadenza = new Date(adempimento.Scadenza);
            scadenza.setHours(0, 0, 0, 0);
            
            let badgeScadenza = '';
            if (scadenza < oggi) {
                badgeScadenza = '<span class="badge badge-scaduto">SCADUTO</span>';
            } else {
                const giorni = Math.floor((scadenza - oggi) / (1000 * 60 * 60 * 24));
                if (giorni <= 7) {
                    badgeScadenza = `<span class="badge badge-prossimo">SCADE TRA ${giorni} GG</span>`;
                }
            }
            
            const comuni = adempimento.Comuni.split(';');
            const statiComuni = adempimento.StatiComuni || {};
            
            let completati = 0;
            comuni.forEach(comune => {
                const stato = statiComuni[comune.trim()] || { fatto: false };
                if (stato.fatto) completati++;
            });
            
            const percentuale = Math.round((completati / comuni.length) * 100);
            
            card.innerHTML = `
                <div class="adempimento-header">
                    <div class="adempimento-title">${adempimento.Titolo}</div>
                    <div class="adempimento-badges">
                        <span class="badge badge-categoria-${adempimento.Categoria.toLowerCase()}">${adempimento.Categoria}</span>
                        ${badgeScadenza}
                    </div>
                </div>
                
                ${adempimento.Descrizione ? `<div style="margin-bottom: 15px; color: #555; line-height: 1.6;">${adempimento.Descrizione}</div>` : ''}
                
                <div class="adempimento-meta">
                    <div class="adempimento-meta-item">
                        <strong>📅 SCADENZA</strong>
                        <span>${formattaData(adempimento.Scadenza)}</span>
                    </div>
                    <div class="adempimento-meta-item">
                        <strong>👤 RESPONSABILE</strong>
                        <span>${adempimento.Responsabile || 'Non assegnato'}</span>
                    </div>
                    <div class="adempimento-meta-item">
                        <strong>📊 PROGRESSO</strong>
                        <span>${completati}/${comuni.length} comuni (${percentuale}%)</span>
                    </div>
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${percentuale}%"></div>
                </div>
                
                <table class="comuni-table">
                    <thead>
                        <tr>
                            <th>Comune</th>
                            <th class="checkbox-cell">Da Fare</th>
                            <th class="checkbox-cell">Fatto</th>
                            <th style="width: 200px;">Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${comuni.map(comune => {
                            const comunePulito = comune.trim();
                            const stato = statiComuni[comunePulito] || { daFare: false, fatto: false, note: '' };
                            return `
                                <tr>
                                    <td><strong>${comunePulito}</strong></td>
                                    <td class="checkbox-cell">
                                        <input type="checkbox" 
                                               ${stato.daFare ? 'checked' : ''} 
                                               onchange="aggiornaStatoComune(${adempimento.ID}, '${comunePulito}', 'daFare', this.checked)">
                                    </td>
                                    <td class="checkbox-cell">
                                        <input type="checkbox" 
                                               ${stato.fatto ? 'checked' : ''} 
                                               onchange="aggiornaStatoComune(${adempimento.ID}, '${comunePulito}', 'fatto', this.checked)">
                                    </td>
                                    <td>
                                        <input type="text" 
                                               class="note-input" 
                                               value="${stato.note || ''}" 
                                               placeholder="Note..."
                                               onchange="aggiornaStatoComune(${adempimento.ID}, '${comunePulito}', 'note', this.value)">
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
                
                ${isUtenteAdmin() ? `
                <div class="adempimento-actions">
                    <button class="btn-warning" onclick="modificaAdempimento(${adempimento.ID})">✏️ Modifica</button>
                    <button class="btn-danger" onclick="eliminaAdempimento(${adempimento.ID})">🗑️ Elimina</button>
                </div>
                ` : ''}
            `;
            
            return card;
        }

        function aggiornaStatoComune(adempimentoId, comune, campo, valore) {
            const adempimento = adempimenti.find(a => a.ID === adempimentoId);
            if (!adempimento) return;
            
            if (!adempimento.StatiComuni) {
                adempimento.StatiComuni = {};
            }
            
            if (!adempimento.StatiComuni[comune]) {
                adempimento.StatiComuni[comune] = { daFare: false, fatto: false, note: '' };
            }
            
            adempimento.StatiComuni[comune][campo] = valore;
            
            salvaDati();
            aggiornaStatistiche();
            renderizzaAdempimenti();
            
            console.log(`✅ Aggiornato stato ${comune} per adempimento ${adempimentoId}: ${campo} = ${valore}`);
        }

        function formattaData(dataStr) {
            const data = new Date(dataStr);
            const giorni = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
            const mesi = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
            
            return `${giorni[data.getDay()]} ${data.getDate()} ${mesi[data.getMonth()]} ${data.getFullYear()}`;
        }

        // ============================================
        // GESTIONE FILTRI
        // ============================================

        function applicaFiltri() {
            const filtroMese = document.getElementById('filtroMese').value;
            const filtroCategoria = document.getElementById('filtroCategoria').value;
            const filtroStato = document.getElementById('filtroStato').value;
            const filtroComune = document.getElementById('filtroComune').value;
            const filtroResponsabile = document.getElementById('filtroResponsabile').value;
            
            let risultati = [...adempimenti];
            
            if (filtroMese) {
                const [anno, mese] = filtroMese.split('-');
                risultati = risultati.filter(a => {
                    const dataScadenza = new Date(a.Scadenza);
                    return dataScadenza.getFullYear() === parseInt(anno) && 
                           (dataScadenza.getMonth() + 1) === parseInt(mese);
                });
            }
            
            if (filtroCategoria) {
                risultati = risultati.filter(a => a.Categoria === filtroCategoria);
            }
            
            if (filtroStato) {
                const oggi = new Date();
                oggi.setHours(0, 0, 0, 0);
                
                risultati = risultati.filter(a => {
                    const comuni = a.Comuni.split(';');
                    const statiComuni = a.StatiComuni || {};
                    
                    return comuni.some(comune => {
                        const stato = statiComuni[comune.trim()] || { fatto: false };
                        const scadenza = new Date(a.Scadenza);
                        scadenza.setHours(0, 0, 0, 0);
                        
                        if (filtroStato === 'completato') return stato.fatto;
                        if (filtroStato === 'da_fare') return !stato.fatto;
                        if (filtroStato === 'scaduto') return !stato.fatto && scadenza < oggi;
                        return true;
                    });
                });
            }
            
            if (filtroComune) {
                risultati = risultati.filter(a => {
                    const comuni = a.Comuni.split(';').map(c => c.trim());
                    return comuni.includes(filtroComune);
                });
            }
            
            if (filtroResponsabile) {
                risultati = risultati.filter(a => a.Responsabile === filtroResponsabile);
            }
            
            return risultati.sort((a, b) => new Date(a.Scadenza) - new Date(b.Scadenza));
        }

        function pulisciFiltri() {
            impostaFiltroMeseCorrente();
            document.getElementById('filtroCategoria').value = '';
            document.getElementById('filtroStato').value = '';
            document.getElementById('filtroComune').value = '';
            document.getElementById('filtroResponsabile').value = '';
            renderizzaAdempimenti();
        }

        // ============================================
        // GESTIONE MODAL
        // ============================================

        function apriModalCreazione() {
            if (!isUtenteAdmin()) {
                alert('Solo gli amministratori possono creare nuovi adempimenti');
                return;
            }
            
            adempimentoInModifica = null;
            document.getElementById('modalTitolo').textContent = 'Nuovo Adempimento';
            document.getElementById('formAdempimento').reset();
            document.getElementById('adempimentoId').value = '';
            
            const checkboxes = document.querySelectorAll('#comuniSelector input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            
            document.getElementById('modalAdempimento').classList.add('active');
        }

        function modificaAdempimento(id) {
            if (!isUtenteAdmin()) {
                alert('Solo gli amministratori possono modificare gli adempimenti');
                return;
            }
            
            const adempimento = adempimenti.find(a => a.ID === id);
            if (!adempimento) {
                alert('Adempimento non trovato');
                return;
            }
            
            adempimentoInModifica = adempimento;
            document.getElementById('modalTitolo').textContent = 'Modifica Adempimento';
            document.getElementById('adempimentoId').value = adempimento.ID;
            document.getElementById('inputTitolo').value = adempimento.Titolo;
            document.getElementById('inputDescrizione').value = adempimento.Descrizione || '';
            document.getElementById('inputCategoria').value = adempimento.Categoria;
            document.getElementById('inputScadenza').value = adempimento.Scadenza;
            document.getElementById('inputResponsabile').value = adempimento.Responsabile || '';
            
            const comuniSelezionati = adempimento.Comuni.split(';').map(c => c.trim());
            const checkboxes = document.querySelectorAll('#comuniSelector input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = comuniSelezionati.includes(cb.value);
            });
            
            document.getElementById('modalAdempimento').classList.add('active');
        }

        function chiudiModal() {
            document.getElementById('modalAdempimento').classList.remove('active');
            adempimentoInModifica = null;
        }

        function toggleTuttiComuni() {
            const checkboxes = document.querySelectorAll('#comuniSelector input[type="checkbox"]');
            const tuttiSelezionati = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !tuttiSelezionati);
        }

        // ============================================
        // CRUD ADEMPIMENTI
        // ============================================

        function salvaAdempimento(event) {
            event.preventDefault();
            
            if (!isUtenteAdmin()) {
                alert('Solo gli amministratori possono salvare adempimenti');
                return;
            }
            
            const comuniSelezionati = Array.from(
                document.querySelectorAll('#comuniSelector input[type="checkbox"]:checked')
            ).map(cb => cb.value);
            
            if (comuniSelezionati.length === 0) {
                alert('Seleziona almeno un comune');
                return;
            }
            
            const dati = {
                Titolo: document.getElementById('inputTitolo').value.trim(),
                Descrizione: document.getElementById('inputDescrizione').value.trim(),
                Categoria: document.getElementById('inputCategoria').value,
                Scadenza: document.getElementById('inputScadenza').value,
                Responsabile: document.getElementById('inputResponsabile').value,
                Comuni: comuniSelezionati.join(';')
            };
            
            const idModifica = document.getElementById('adempimentoId').value;
            
            if (idModifica) {
                const index = adempimenti.findIndex(a => a.ID === parseInt(idModifica));
                if (index !== -1) {
                    adempimenti[index] = { 
                        ...adempimenti[index], 
                        ...dati 
                    };
                    console.log('✏️ Adempimento modificato:', adempimenti[index]);
                }
            } else {
                const nuovoId = adempimenti.length > 0 ? Math.max(...adempimenti.map(a => a.ID)) + 1 : 1;
                const nuovoAdempimento = { 
                    ID: nuovoId, 
                    ...dati,
                    StatiComuni: {}
                };
                adempimenti.push(nuovoAdempimento);
                console.log('➕ Nuovo adempimento creato:', nuovoAdempimento);
            }
            
            salvaDati();
            aggiornaStatistiche();
            renderizzaAdempimenti();
            chiudiModal();
            
            alert('✅ Adempimento salvato con successo!');
        }

        function eliminaAdempimento(id) {
            if (!isUtenteAdmin()) {
                alert('Solo gli amministratori possono eliminare adempimenti');
                return;
            }
            
            const adempimento = adempimenti.find(a => a.ID === id);
            if (!adempimento) {
                alert('Adempimento non trovato');
                return;
            }
            
            if (confirm(`Confermi l'eliminazione dell'adempimento "${adempimento.Titolo}"?`)) {
                adempimenti = adempimenti.filter(a => a.ID !== id);
                salvaDati();
                aggiornaStatistiche();
                renderizzaAdempimenti();
                console.log('🗑️ Adempimento eliminato:', id);
                alert('✅ Adempimento eliminato con successo');
            }
        }

        // ============================================
        // ALERT SCADENZE
        // ============================================

        function mostraAlert() {
            const oggi = new Date();
            oggi.setHours(0, 0, 0, 0);
            
            const settimana = new Date(oggi);
            settimana.setDate(settimana.getDate() + 7);
            
            let alertScaduti = [];
            let alertProssimi = [];
            
            adempimenti.forEach(adempimento => {
                const scadenza = new Date(adempimento.Scadenza);
                scadenza.setHours(0, 0, 0, 0);
                
                const comuni = adempimento.Comuni.split(';');
                const statiComuni = adempimento.StatiComuni || {};
                
                comuni.forEach(comune => {
                    const comunePulito = comune.trim();
                    const stato = statiComuni[comunePulito] || { fatto: false };
                    
                    if (!stato.fatto) {
                        if (scadenza < oggi) {
                            alertScaduti.push(`${adempimento.Titolo} - ${comunePulito}`);
                        } else if (scadenza <= settimana) {
                            const giorni = Math.floor((scadenza - oggi) / (1000 * 60 * 60 * 24));
                            alertProssimi.push(`${adempimento.Titolo} - ${comunePulito} (${giorni} gg)`);
                        }
                    }
                });
            });
            
            let messaggio = '🔔 ALERT SCADENZE\n\n';
            
            if (alertScaduti.length > 0) {
                messaggio += '❌ SCADUTI:\n' + alertScaduti.slice(0, 10).join('\n') + '\n\n';
            }
            
            if (alertProssimi.length > 0) {
                messaggio += '⚠️ PROSSIMI 7 GIORNI:\n' + alertProssimi.slice(0, 10).join('\n');
            }
            
            if (alertScaduti.length === 0 && alertProssimi.length === 0) {
                messaggio += '✅ Nessuna scadenza critica!';
            }
            
            alert(messaggio);
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                chiudiModal();
            }
        });

        document.getElementById('modalAdempimento').addEventListener('click', function(event) {
            if (event.target === this) {
                chiudiModal();
            }
        });

        window.addEventListener('DOMContentLoaded', inizializzaSistema);

    </script>
